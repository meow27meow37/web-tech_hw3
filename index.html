<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на комнату в общежитии</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Заявка на заселение</h2>
        <form id="applicationForm">
            <div class="form-group">
                <label for="studentId">ID студента:</label>
                <input type="number" id="studentId" placeholder="Например: 1" required>
            </div>

            <div class="form-group">
                <label for="buildingNum">Номер корпуса:</label>
                <input type="number" id="buildingNum" placeholder="Например: 1" required>
            </div>

            <div class="form-group">
                <label for="roomNum">Номер комнаты:</label>
                <input type="number" id="roomNum" placeholder="Например: 101" required>
            </div>

            <button type="submit">Проверить условия</button>
        </form>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
